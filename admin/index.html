<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Área Restrita | Igreja Batista Jardins</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="ibj-admin-body">

<header class="ibj-admin-topo">
  <div class="container d-flex align-items-center justify-content-between py-3">
    <a href="../index.html" class="ibj-admin-voltar"><i class="fa-solid fa-arrow-left me-2"></i>Voltar ao site</a>
    <span class="ibj-admin-marca">Área Restrita · IBJ</span>
  </div>
</header>

<main class="container py-4 py-md-5">

  <!-- LOGIN -->
  <section id="tela-login" class="ibj-form-card mx-auto" style="max-width: 420px;">
    <h1 class="ibj-titulo h4 mb-1">Entrar</h1>
    <p class="ibj-texto mb-4" style="font-size: .95rem;">Acesso restrito à administração da agenda.</p>
    <form id="form-login" novalidate>
      <div class="mb-3">
        <label for="login-email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="login-email" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="login-senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="login-senha" autocomplete="current-password" required>
      </div>
      <p id="login-erro" class="text-danger small mb-3" hidden></p>
      <button type="submit" class="ibj-btn ibj-btn-primary ibj-btn-lg w-100" id="login-botao">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
      </button>
    </form>
  </section>

  <!-- PAINEL (só aparece depois do login) -->
  <section id="tela-painel" hidden>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
      <div>
        <h1 class="ibj-titulo h4 mb-0">Eventos especiais da Agenda</h1>
        <p class="ibj-texto mb-0" style="font-size: .95rem;">Esses eventos aparecem na seção "Nossa Agenda" do site, além dos cultos fixos de domingo e quarta.</p>
      </div>
      <button type="button" class="ibj-btn" id="botao-sair" style="background:#fff; border-color:#ddd; color:#555;">
        <i class="fa-solid fa-right-from-bracket me-2"></i>Sair
      </button>
    </div>

    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <form id="form-evento" class="ibj-form-card">
          <h2 class="h6 fw-800 mb-3">Novo evento</h2>
          <div class="mb-3">
            <label for="ev-data" class="form-label">Data</label>
            <input type="date" class="form-control" id="ev-data" required>
          </div>
          <div class="mb-3">
            <label for="ev-hora" class="form-label">Horário (ex: 19h ou 19h30)</label>
            <input type="text" class="form-control" id="ev-hora" placeholder="19h" required>
          </div>
          <div class="mb-3">
            <label for="ev-titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="ev-titulo" placeholder="Culto de Natal" required>
          </div>
          <div class="mb-3">
            <label for="ev-local" class="form-label">Local <span class="text-muted">(opcional)</span></label>
            <input type="text" class="form-control" id="ev-local" placeholder="Templo principal">
          </div>
          <p id="evento-erro" class="text-danger small mb-3" hidden></p>
          <p id="evento-sucesso" class="text-success small mb-3" hidden></p>
          <button type="submit" class="ibj-btn ibj-btn-primary w-100" id="evento-botao">
            <i class="fa-solid fa-plus me-2"></i>Adicionar evento
          </button>
        </form>
      </div>

      <div class="col-12 col-lg-7">
        <div class="ibj-form-card">
          <h2 class="h6 fw-800 mb-3">Eventos cadastrados</h2>
          <div id="lista-eventos">
            <p class="ibj-texto" style="font-size:.95rem;">Carregando…</p>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
